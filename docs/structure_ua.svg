<svg viewBox="0 0 1040 806" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowSolid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/>
    </marker>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="806" rx="16" fill="#fafafa" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="520" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Winget Upgrade — потік модулів</text>

  <!-- Settings dashed connections (drawn first, underneath) -->
  <line x1="760" y1="402" x2="642" y2="101" stroke="#94a3b8" stroke-width="1.75" stroke-dasharray="5,4" marker-end="url(#arrowDashed)"/>
  <line x1="760" y1="402" x2="634" y2="224" stroke="#94a3b8" stroke-width="1.75" stroke-dasharray="5,4" marker-end="url(#arrowDashed)"/>
  <line x1="760" y1="402" x2="640" y2="402" stroke="#94a3b8" stroke-width="1.75" stroke-dasharray="5,4" marker-end="url(#arrowDashed)"/>
  <line x1="760" y1="402" x2="634" y2="580" stroke="#94a3b8" stroke-width="1.75" stroke-dasharray="5,4" marker-end="url(#arrowDashed)"/>

  <!-- Main pipeline arrows -->
  <line x1="490" y1="126" x2="490" y2="166" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arrowSolid)"/>
  <line x1="640" y1="198" x2="760" y2="198" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arrowSolid)"/>
  <line x1="490" y1="230" x2="490" y2="270" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arrowSolid)"/>
  <line x1="490" y1="326" x2="490" y2="370" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arrowSolid)"/>
  <line x1="280" y1="402" x2="340" y2="402" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arrowSolid)"/>
  <line x1="490" y1="434" x2="490" y2="474" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arrowSolid)"/>
  <line x1="490" y1="538" x2="490" y2="574" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arrowSolid)"/>
  <line x1="340" y1="606" x2="280" y2="606" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arrowSolid)"/>
  <line x1="640" y1="606" x2="760" y2="606" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arrowSolid)"/>
  <line x1="490" y1="638" x2="490" y2="678" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arrowSolid)"/>

  <!-- Edge labels -->
  <g font-size="11.5" fill="#334155">
    <rect x="645" y="189" width="110" height="18" fill="#fafafa"/>
    <text x="700" y="202" text-anchor="middle">оновлено</text>

    <rect x="480" y="239" width="200" height="18" fill="#fafafa"/>
    <text x="580" y="252" text-anchor="middle">немає оновлень / відмова</text>
  </g>

  <!-- Main.js -->
  <g>
    <rect x="340" y="70" width="300" height="56" rx="10" fill="#334155" stroke="#1e293b" stroke-width="2"/>
    <text x="490" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">main.js</text>
  </g>

  <!-- Updater.js -->
  <g>
    <rect x="340" y="166" width="300" height="64" rx="10" fill="#7c3aed" stroke="#5b21b6" stroke-width="2"/>
    <text x="490" y="192" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">updater.js</text>
    <text x="490" y="210" text-anchor="middle" font-size="12" fill="#ede9fe">checkForUpdate()</text>
  </g>

  <!-- Relaunch -->
  <g>
    <rect x="760" y="166" width="240" height="64" rx="10" fill="#334155" stroke="#1e293b" stroke-width="2"/>
    <text x="880" y="192" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Перезапуск</text>
    <text x="880" y="210" text-anchor="middle" font-size="12" fill="#e2e8f0">оновленої програми</text>
  </g>

  <!-- Check winget -->
  <g>
    <rect x="340" y="270" width="300" height="56" rx="10" fill="#334155" stroke="#1e293b" stroke-width="2"/>
    <text x="490" y="294" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Перевірка наявності winget</text>
    <text x="490" y="312" text-anchor="middle" font-size="12" fill="#e2e8f0">+ версії</text>
  </g>

  <!-- Discover -->
  <g>
    <rect x="340" y="370" width="300" height="64" rx="10" fill="#0d9488" stroke="#115e59" stroke-width="2"/>
    <text x="490" y="396" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">utils.js</text>
    <text x="490" y="414" text-anchor="middle" font-size="12" fill="#ccfbf1">discoverUpgradablePackages()</text>
  </g>

  <!-- Ignore file -->
  <g>
    <rect x="40" y="374" width="240" height="56" rx="10" fill="#b45309" stroke="#78350f" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="160" y="407" text-anchor="middle" font-size="13" font-weight="700" fill="#fff7ed">winget_ignore.txt</text>
  </g>

  <!-- Settings.js -->
  <g>
    <rect x="760" y="370" width="240" height="64" rx="10" fill="#64748b" stroke="#334155" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="880" y="396" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">settings.js</text>
    <text x="880" y="414" text-anchor="middle" font-size="12" fill="#f1f5f9">шляхи та аргументи winget</text>
  </g>

  <!-- Show + pause -->
  <g>
    <rect x="330" y="474" width="320" height="64" rx="10" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
    <text x="490" y="500" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">console_ui.js</text>
    <text x="490" y="518" text-anchor="middle" font-size="12" fill="#dbeafe">printDiscoveredPackages() + пауза</text>
  </g>

  <!-- Loop -->
  <g>
    <rect x="340" y="574" width="300" height="64" rx="10" fill="#0d9488" stroke="#115e59" stroke-width="2"/>
    <text x="490" y="600" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">utils.js</text>
    <text x="490" y="618" text-anchor="middle" font-size="12" fill="#ccfbf1">upgradePackage() по пакету</text>
  </g>

  <!-- Log file -->
  <g>
    <rect x="40" y="578" width="240" height="56" rx="10" fill="#b45309" stroke="#78350f" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="160" y="611" text-anchor="middle" font-size="13" font-weight="700" fill="#fff7ed">winget_upgrade.log</text>
  </g>

  <!-- Progress -->
  <g>
    <rect x="760" y="574" width="240" height="64" rx="10" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
    <text x="880" y="600" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">console_ui.js</text>
    <text x="880" y="618" text-anchor="middle" font-size="12" fill="#dbeafe">прогрес-бар / ETA</text>
  </g>

  <!-- Summary -->
  <g>
    <rect x="330" y="678" width="320" height="64" rx="10" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
    <text x="490" y="704" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">console_ui.js</text>
    <text x="490" y="722" text-anchor="middle" font-size="12" fill="#dbeafe">printSummaryTable()</text>
  </g>

  <!-- Legend -->
  <g font-size="12" fill="#334155">
    <rect x="60" y="764" width="16" height="16" rx="3" fill="#334155"/>
    <text x="82" y="777">потік main.js</text>

    <rect x="200" y="764" width="16" height="16" rx="3" fill="#7c3aed"/>
    <text x="222" y="777">updater.js</text>

    <rect x="320" y="764" width="16" height="16" rx="3" fill="#0d9488"/>
    <text x="342" y="777">utils.js</text>

    <rect x="428" y="764" width="16" height="16" rx="3" fill="#2563eb"/>
    <text x="450" y="777">console_ui.js</text>

    <rect x="568" y="764" width="16" height="16" rx="3" fill="#b45309" stroke="#78350f" stroke-dasharray="3,2"/>
    <text x="590" y="777">файл даних</text>

    <rect x="694" y="764" width="16" height="16" rx="3" fill="#64748b" stroke="#334155" stroke-dasharray="3,2"/>
    <text x="716" y="777">settings.js (конфігурація)</text>
  </g>
</svg>
