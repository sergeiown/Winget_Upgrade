<svg viewBox="0 0 1100 920" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowSolid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-solid"/>
    </marker>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-dashed"/>
    </marker>
  </defs>

  <style>
    .frame { fill: #f8fafc; stroke: #e2e8f0; }
    .title { fill: #0f172a; }
    .label-bg { fill: #f8fafc; }
    .label-text { fill: #475569; }
    .note-text { fill: #64748b; }
    .legend-text { fill: #334155; }
    .arrow-solid { fill: #334155; }
    .arrow-dashed { fill: #94a3b8; }
    .line-solid { stroke: #334155; }
    .line-dashed { stroke: #94a3b8; }

    @media (prefers-color-scheme: dark) {
      .frame { fill: #111827; stroke: #1f2937; }
      .title { fill: #e5e7eb; }
      .label-bg { fill: #111827; }
      .label-text { fill: #cbd5e1; }
      .note-text { fill: #94a3b8; }
      .legend-text { fill: #cbd5e1; }
      .arrow-solid { fill: #cbd5e1; }
      .arrow-dashed { fill: #64748b; }
      .line-solid { stroke: #cbd5e1; }
      .line-dashed { stroke: #64748b; }
    }
  </style>

  <rect x="0" y="0" width="1100" height="920" rx="16" class="frame" stroke-width="1.5"/>
  <text x="550" y="34" text-anchor="middle" font-size="18" font-weight="700" class="title">Winget Upgrade - потік модулів</text>

  <!-- Main pipeline arrows -->
  <line x1="490" y1="126" x2="490" y2="166" class="line-solid" stroke-width="2.5" marker-end="url(#arrowSolid)"/>
  <line x1="640" y1="198" x2="800" y2="198" class="line-solid" stroke-width="2.5" marker-end="url(#arrowSolid)"/>
  <line x1="490" y1="230" x2="490" y2="270" class="line-solid" stroke-width="2.5" marker-end="url(#arrowSolid)"/>
  <line x1="490" y1="326" x2="490" y2="370" class="line-solid" stroke-width="2.5" marker-end="url(#arrowSolid)"/>
  <line x1="280" y1="402" x2="340" y2="402" class="line-solid" stroke-width="2.5" marker-end="url(#arrowSolid)"/>
  <line x1="490" y1="434" x2="490" y2="474" class="line-solid" stroke-width="2.5" marker-end="url(#arrowSolid)"/>
  <line x1="490" y1="538" x2="490" y2="574" class="line-solid" stroke-width="2.5" marker-end="url(#arrowSolid)"/>
  <line x1="340" y1="606" x2="280" y2="606" class="line-solid" stroke-width="2.5" marker-end="url(#arrowSolid)"/>
  <line x1="490" y1="638" x2="490" y2="678" class="line-solid" stroke-width="2.5" marker-end="url(#arrowSolid)"/>

  <!-- Settings screen: F2 open / close, dashed, bidirectional -->
  <line x1="640" y1="500" x2="798" y2="500" class="line-dashed" stroke-width="1.75" stroke-dasharray="5,4" marker-end="url(#arrowDashed)"/>
  <line x1="798" y1="512" x2="640" y2="512" class="line-dashed" stroke-width="1.75" stroke-dasharray="5,4" marker-end="url(#arrowDashed)"/>

  <!-- settings_ui.js writes winget_language.txt -->
  <line x1="920" y1="538" x2="920" y2="578" class="line-dashed" stroke-width="1.75" stroke-dasharray="5,4" marker-end="url(#arrowDashed)"/>

  <!-- Edge labels -->
  <g font-size="11.5">
    <rect x="648" y="189" width="150" height="18" class="label-bg"/>
    <text x="723" y="202" text-anchor="middle" font-size="10.5" class="label-text">оновлення встановлено</text>

    <rect x="480" y="239" width="200" height="18" class="label-bg"/>
    <text x="580" y="252" text-anchor="middle" class="label-text">немає оновлень / відмова</text>

    <rect x="642" y="480" width="152" height="16" class="label-bg"/>
    <text x="718" y="492" text-anchor="middle" font-size="11" class="label-text">F2 відкриває / Esc закриває</text>

    <rect x="650" y="608" width="130" height="16" class="label-bg"/>
    <text x="715" y="620" text-anchor="middle" font-size="11" fill="#d97706">F5 → пропустити пакет</text>
  </g>

  <!-- main.js -->
  <g>
    <rect x="340" y="70" width="300" height="56" rx="10" fill="#3b4b6b" stroke="#26314a" stroke-width="2"/>
    <text x="490" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">main.js</text>
  </g>

  <!-- updater.js -->
  <g>
    <rect x="340" y="166" width="300" height="64" rx="10" fill="#6d5bd0" stroke="#4c3f9e" stroke-width="2"/>
    <text x="490" y="192" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">updater.js</text>
    <text x="490" y="210" text-anchor="middle" font-size="12" fill="#e6e1ff">checkForUpdate() → .bat-хелпер</text>
  </g>

  <!-- Relaunch -->
  <g>
    <rect x="800" y="166" width="240" height="64" rx="10" fill="#3b4b6b" stroke="#26314a" stroke-width="2"/>
    <text x="920" y="192" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Перезапуск</text>
    <text x="920" y="210" text-anchor="middle" font-size="12" fill="#dbe3ee">оновленої програми</text>
  </g>

  <!-- Check winget -->
  <g>
    <rect x="340" y="270" width="300" height="56" rx="10" fill="#3b4b6b" stroke="#26314a" stroke-width="2"/>
    <text x="490" y="294" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Перевірка наявності winget</text>
    <text x="490" y="312" text-anchor="middle" font-size="12" fill="#dbe3ee">+ версії</text>
  </g>

  <!-- Discover -->
  <g>
    <rect x="340" y="370" width="300" height="64" rx="10" fill="#1f9d8f" stroke="#146b62" stroke-width="2"/>
    <text x="490" y="396" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">utils.js</text>
    <text x="490" y="414" text-anchor="middle" font-size="12" fill="#d3f5ef">discoverUpgradablePackages()</text>
  </g>

  <!-- Ignore file -->
  <g>
    <rect x="40" y="374" width="240" height="56" rx="10" fill="#c4791f" stroke="#8a5316" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="160" y="407" text-anchor="middle" font-size="13" font-weight="700" fill="#fff3e2">winget_ignore.txt</text>
  </g>

  <!-- console_ui.js: TUI -->
  <g>
    <rect x="340" y="474" width="300" height="64" rx="10" fill="#3574e0" stroke="#1f4fa8" stroke-width="2"/>
    <text x="490" y="500" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">console_ui.js</text>
    <text x="490" y="518" text-anchor="middle" font-size="12" fill="#dde9fb">повноекранний TUI: сесія / операція / прогрес / події</text>
  </g>

  <!-- settings_ui.js -->
  <g>
    <rect x="800" y="474" width="240" height="64" rx="10" fill="#3574e0" stroke="#1f4fa8" stroke-width="2"/>
    <text x="920" y="496" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">settings_ui.js</text>
    <text x="920" y="512" text-anchor="middle" font-size="11" fill="#dde9fb">Загальні · Ігнор-лист</text>
    <text x="920" y="527" text-anchor="middle" font-size="11" fill="#dde9fb">Розширені (admin overrides)</text>
  </g>

  <!-- settings_ui.js -> winget_settings.js -->
  <line x1="920" y1="538" x2="920" y2="652" class="line-dashed" stroke-width="1.75" stroke-dasharray="5,4" marker-end="url(#arrowDashed)"/>

  <!-- winget_settings.js -->
  <g>
    <rect x="800" y="652" width="240" height="64" rx="10" fill="#1f9d8f" stroke="#146b62" stroke-width="2"/>
    <text x="920" y="678" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">winget_settings.js</text>
    <text x="920" y="696" text-anchor="middle" font-size="11" fill="#d3f5ef">читає/пише settings.json winget</text>
  </g>

  <!-- winget_language.txt + startup shortcut -->
  <g>
    <rect x="800" y="578" width="240" height="56" rx="10" fill="#c4791f" stroke="#8a5316" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="920" y="601" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff3e2">winget_language.txt</text>
    <text x="920" y="618" text-anchor="middle" font-size="10.5" fill="#fde3c2">+ ярлик автозапуску</text>
  </g>

  <!-- Loop -->
  <g>
    <rect x="340" y="574" width="300" height="64" rx="10" fill="#1f9d8f" stroke="#146b62" stroke-width="2"/>
    <text x="490" y="600" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">utils.js</text>
    <text x="490" y="618" text-anchor="middle" font-size="12" fill="#d3f5ef">upgradePackage() по пакету</text>
  </g>

  <!-- Log file -->
  <g>
    <rect x="40" y="578" width="240" height="56" rx="10" fill="#c4791f" stroke="#8a5316" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="160" y="611" text-anchor="middle" font-size="13" font-weight="700" fill="#fff3e2">winget_upgrade.log</text>
  </g>

  <!-- Summary -->
  <g>
    <rect x="340" y="678" width="300" height="64" rx="10" fill="#3574e0" stroke="#1f4fa8" stroke-width="2"/>
    <text x="490" y="704" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">console_ui.js</text>
    <text x="490" y="722" text-anchor="middle" font-size="12" fill="#dde9fb">showSummary()</text>
  </g>

  <!-- Cross-cutting modules -->
  <g>
    <rect x="80" y="800" width="300" height="56" rx="10" fill="#5b6b82" stroke="#3a4658" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="230" y="823" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">settings.js</text>
    <text x="230" y="840" text-anchor="middle" font-size="11" fill="#e7ebf0">шляхи, аргументи winget, версія</text>
  </g>
  <g>
    <rect x="400" y="800" width="300" height="56" rx="10" fill="#5b6b82" stroke="#3a4658" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="550" y="823" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">i18n.js</text>
    <text x="550" y="840" text-anchor="middle" font-size="11" fill="#e7ebf0">рядки EN/UK, перемикання мови</text>
  </g>
  <g>
    <rect x="720" y="800" width="300" height="56" rx="10" fill="#5b6b82" stroke="#3a4658" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="870" y="823" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">app_settings.js</text>
    <text x="870" y="840" text-anchor="middle" font-size="11" fill="#e7ebf0">затримка виходу, winget_autoclose.txt</text>
  </g>
  <text x="550" y="789" text-anchor="middle" font-size="11" class="note-text">↑ використовується напряму в main.js, updater.js, console_ui.js та settings_ui.js</text>

  <!-- Legend -->
  <g font-size="12">
    <rect x="60" y="882" width="16" height="16" rx="3" fill="#3b4b6b"/>
    <text x="82" y="895" class="legend-text">потік main.js</text>

    <rect x="200" y="882" width="16" height="16" rx="3" fill="#6d5bd0"/>
    <text x="222" y="895" class="legend-text">updater.js</text>

    <rect x="320" y="882" width="16" height="16" rx="3" fill="#1f9d8f"/>
    <text x="342" y="895" class="legend-text">utils.js</text>

    <rect x="428" y="882" width="16" height="16" rx="3" fill="#3574e0"/>
    <text x="450" y="895" class="legend-text">console_ui.js / settings_ui.js</text>

    <rect x="700" y="882" width="16" height="16" rx="3" fill="#c4791f" stroke="#8a5316" stroke-dasharray="3,2"/>
    <text x="722" y="895" class="legend-text">файл даних</text>

    <rect x="826" y="882" width="16" height="16" rx="3" fill="#5b6b82" stroke="#3a4658" stroke-dasharray="3,2"/>
    <text x="848" y="895" class="legend-text">конфігурація / текстовий модуль</text>
  </g>
</svg>
