name: Build and release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      INNO_COMPILER: "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe"
      CERT_PATH: ${{ github.workspace }}\certificate.pfx
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install pkg
        run: npm install -g pkg

      - name: Build executable
        run: pkg --compress Brotli --target node18-win-x64 --output winget_upgrade.exe main.js

      - name: Install rcedit
        run: npm install -g rcedit

      - name: Embed application icon
        shell: pwsh
        run: |
          $rcedit = Join-Path (npm root -g) 'rcedit/bin/rcedit-x64.exe'
          & $rcedit winget_upgrade.exe --set-icon sagittarius.ico

      - name: Decode code-signing certificate
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
        run: |
          $bytes = [Convert]::FromBase64String($env:CERT_BASE64)
          [IO.File]::WriteAllBytes($env:CERT_PATH, $bytes)

      - name: Locate signtool
        shell: pwsh
        run: |
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -like "*x64*" } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
          if (-not $signtool) {
              throw "signtool.exe not found under Windows Kits"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $signtool.Directory

      - name: Sign executable
        shell: cmd
        env:
          CERT_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: signtool sign /f "%CERT_PATH%" /p "%CERT_PASSWORD%" /t http://timestamp.digicert.com /fd SHA256 winget_upgrade.exe

      - name: Verify Inno Setup is available
        shell: pwsh
        run: |
          if (-not (Test-Path $env:INNO_COMPILER)) {
              throw "Inno Setup compiler not found at $env:INNO_COMPILER"
          }

      - name: Build installer
        shell: cmd
        env:
          CERT_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: "\"%INNO_COMPILER%\" \"/Smysign=signtool.exe sign /f %CERT_PATH% /p %CERT_PASSWORD% /t http://timestamp.digicert.com /fd SHA256 $f\" installer\\winget_upgrade.iss"

      - name: Remove certificate file
        if: always()
        shell: pwsh
        run: Remove-Item -Force $env:CERT_PATH -ErrorAction SilentlyContinue

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "Winget Upgrade ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
          files: |
            winget_upgrade.exe
            dist/WingetUpgradeSetup.exe
